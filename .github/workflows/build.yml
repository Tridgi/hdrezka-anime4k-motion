name: Windows x64 build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore pinned media dependencies
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Test core
        run: dotnet test tests/HDREZKA.Tests/HDREZKA.Tests.csproj -c Release
      - name: Publish self-contained player
        run: dotnet publish src/HDREZKA.App/HDREZKA.App.csproj -c Release -p:Platform=x64 --self-contained true -o artifacts/app
      - name: Prepare package
        shell: pwsh
        run: ./scripts/package.ps1 -InputDirectory artifacts/app -OutputDirectory artifacts/portable
      - uses: actions/upload-artifact@v4
        with:
          name: HDREZKA-Anime4K-Motion-v2-win-x64
          path: artifacts/portable/
          if-no-files-found: error
