name: Windows x64 build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore pinned media dependencies
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Validate installer helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('src/HDREZKA.App/Updater/InstallUpdate.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Verify SVPflow dimensions on low-resolution streams
        run: python scripts/test-motion-resolutions.py
      - name: Verify details layout and notifications routing
        run: python scripts/test-details-pages.py
      - name: Test core
        run: dotnet test tests/HDREZKA.Tests/HDREZKA.Tests.csproj -c Release
      - name: Publish self-contained player
        run: dotnet publish src/HDREZKA.App/HDREZKA.App.csproj -c Release -p:Platform=x64 -p:SourceRevisionId=${{ github.event.pull_request.head.sha || github.sha }} --self-contained true -o artifacts/app
      - name: Prepare package
        shell: pwsh
        run: ./scripts/package.ps1 -InputDirectory artifacts/app -OutputDirectory artifacts/portable
      - name: Smoke-test updater installation and backup
        shell: pwsh
        run: ./scripts/test-updater.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HDREZKA-Anime4K-Motion-2.1.0-win-x64
          path: artifacts/portable/
          if-no-files-found: error
