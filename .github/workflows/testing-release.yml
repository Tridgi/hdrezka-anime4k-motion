name: Publish test prerelease
on:
  push:
    branches: [fix/player-swapchain-dpi-scaling, fix/ratings-updates-polish, feature/player-history-2.2-preview]
  workflow_dispatch:
# Cancel obsolete builds on the same test branch; only the newest commit
# should produce a prerelease.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  publish-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore pinned media dependencies
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Validate installer helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('src/HDREZKA.App/Updater/InstallUpdate.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Verify SVPflow dimensions on low-resolution streams
        run: python scripts/test-motion-resolutions.py
      - name: Verify details layout and notifications routing
        run: python scripts/test-details-pages.py
      - name: Test core
        run: dotnet test tests/HDREZKA.Tests/HDREZKA.Tests.csproj -c Release
      - name: Publish portable Windows player
        run: dotnet publish src/HDREZKA.App/HDREZKA.App.csproj -c Release -p:Platform=x64 -p:SourceRevisionId=${{ github.sha }} --self-contained true -o artifacts/app
      - name: Create verified archive
        shell: pwsh
        run: |
          ./scripts/package.ps1 -InputDirectory artifacts/app -OutputDirectory artifacts/portable
          $asset = 'HDREZKA-Anime4K-Motion-2.2.0-preview.1-win-x64.zip'
          Compress-Archive -Path 'artifacts/portable/*' -DestinationPath "artifacts/$asset" -CompressionLevel Optimal
          $hash = (Get-FileHash "artifacts/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Path artifacts/SHA256SUMS.txt -Encoding Ascii
      - name: Smoke-test updater installation and backup
        shell: pwsh
        run: ./scripts/test-updater.ps1
      - name: Prepare readable prerelease notes
        shell: pwsh
        run: ./scripts/extract-release-notes.ps1 -Version Unreleased -OutputPath artifacts/RELEASE_NOTES.md
      - name: Publish prerelease for the selected test branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = '${{ github.sha }}'
          $short = $sha.Substring(0, 10)
          $tag = "test-$short"
          gh release create $tag artifacts/HDREZKA-Anime4K-Motion-2.2.0-preview.1-win-x64.zip artifacts/SHA256SUMS.txt --repo '${{ github.repository }}' --target $sha --title "Тестовая сборка $short" --notes-file artifacts/RELEASE_NOTES.md --prerelease
