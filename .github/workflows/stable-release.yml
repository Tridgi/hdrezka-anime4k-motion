name: Publish stable release
on:
  push:
    tags: ['v*']
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    # Stable releases normally start from a v* tag. For the explicitly
    # approved 2.1 launch, the marked main merge commit creates that tag
    # after the same full test/build/packaging checks have passed.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' &&
       startsWith(github.event.head_commit.message, 'release: v2.1.0'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require stable release commit on main and matching version
        shell: pwsh
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Stable release must point to a commit in main.' }
          $tag = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { 'v2.1.0' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid stable tag: $tag" }
          [xml]$props = Get-Content -LiteralPath Directory.Build.props
          if ($props.Project.PropertyGroup.Version -ne $tag.Substring(1)) {
            throw "Directory.Build.props version does not match $tag"
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$($tag.Substring(1))" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore pinned media dependencies
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Validate installer helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('src/HDREZKA.App/Updater/InstallUpdate.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Verify SVPflow dimensions on low-resolution streams
        run: python scripts/test-motion-resolutions.py
      - name: Verify details layout and notifications routing
        run: python scripts/test-details-pages.py
      - name: Test core
        run: dotnet test tests/HDREZKA.Tests/HDREZKA.Tests.csproj -c Release
      - name: Publish portable Windows player
        run: dotnet publish src/HDREZKA.App/HDREZKA.App.csproj -c Release -p:Platform=x64 -p:SourceRevisionId=${{ github.sha }} --self-contained true -o artifacts/app
      - name: Prepare archive and release notes
        shell: pwsh
        run: |
          ./scripts/package.ps1 -InputDirectory artifacts/app -OutputDirectory artifacts/portable
          $asset = "HDREZKA-Anime4K-Motion-$env:RELEASE_VERSION-win-x64.zip"
          Compress-Archive -Path 'artifacts/portable/*' -DestinationPath "artifacts/$asset" -CompressionLevel Optimal
          $hash = (Get-FileHash "artifacts/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Path artifacts/SHA256SUMS.txt -Encoding Ascii
          ./scripts/extract-release-notes.ps1 -Version $env:RELEASE_TAG -OutputPath artifacts/RELEASE_NOTES.md
      - name: Smoke-test updater installation and backup
        shell: pwsh
        run: ./scripts/test-updater.ps1
      - name: Create verified stable tag and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $old = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api -X POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to create $tag" }
          }
          elseif ($old.Trim() -ne $env:GITHUB_SHA) {
            throw "$tag already points to a different commit; refusing to move it."
          }

          $asset = "artifacts/HDREZKA-Anime4K-Motion-$env:RELEASE_VERSION-win-x64.zip"
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json id --jq '.id' 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset artifacts/SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "HDREZKA Anime4K Motion $env:RELEASE_VERSION" --notes-file artifacts/RELEASE_NOTES.md --latest
          }
          else {
            gh release create $tag $asset artifacts/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "HDREZKA Anime4K Motion $env:RELEASE_VERSION" --notes-file artifacts/RELEASE_NOTES.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish stable release $tag" }
